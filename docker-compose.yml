services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robostream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with make init-env}
      POSTGRES_DB: ${POSTGRES_DB:-robostream}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      ROBOSTREAM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-robostream}:${POSTGRES_PASSWORD:?Create .env with make init-env}@db:5432/${POSTGRES_DB:-robostream}
      ROBOSTREAM_DATA_DIR: /app/data
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn robostream.api.app:app --host 0.0.0.0 --port 8000"]
  dashboard:
    build: .
    environment:
      ROBOSTREAM_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
volumes:
  postgres_data:

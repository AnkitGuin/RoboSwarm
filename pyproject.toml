[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robostream"
version = "0.1.0"
description = "Auditable synthetic robotics telemetry and episode-quality infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "numpy>=1.26,<3", "pandas>=2.1,<3",
  "pyarrow>=16,<24", "duckdb>=1.1,<2", "PyYAML>=6,<7", "httpx>=0.27,<1",
  "streamlit>=1.39,<2", "plotly>=5.20,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pytest-cov>=5,<8"]

[project.scripts]
robostream = "robostream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "alembic/versions"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
